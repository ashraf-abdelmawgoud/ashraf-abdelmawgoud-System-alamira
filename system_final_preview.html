<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الواجهة النهائية المتكاملة — نظام الأميرة للمبيعات والمخزون</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-dark-emerald: #064e3b;
            --color-deep-forest: #022c22;
            --color-emerald: #047857;
            --color-mint: #059669;
            --color-soft-mint: #ecfdf5;
            --color-mint-border: #a7f3d0;
            --bg-main: #f8fafc;
            --color-surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --navy-dark: #0f172a;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --info: #0284c7;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, sans-serif;
        }

        body {
            background-color: #0b192c;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Control Bar */
        .preview-topbar {
            background: #1e293b;
            border-bottom: 2px solid #334155;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .preview-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 16px;
            color: #38bdf8;
        }

        .preview-title i {
            color: #fbbf24;
            font-size: 20px;
        }

        .viewport-controls {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
            border: 1px solid #334155;
        }

        .vp-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .vp-btn.active, .vp-btn:hover {
            background: var(--color-emerald);
            color: #ffffff;
        }

        .preview-frame-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background: #0f172a;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        .preview-window {
            background: var(--bg-main);
            color: var(--text-dark);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: width 0.3s ease;
            width: 100%;
            max-width: 1400px;
            min-height: 850px;
            display: flex;
            border: 1px solid #334155;
            position: relative;
        }

        /* Mock App Layout inside window */
        .mock-sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--color-deep-forest) 0%, var(--color-dark-emerald) 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .mock-brand {
            padding: 20px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .mock-brand i {
            font-size: 24px;
            color: #facc15;
        }

        .mock-brand h1 {
            font-size: 16px;
            font-weight: 900;
        }

        .mock-brand p {
            font-size: 11px;
            color: var(--color-mint-border);
        }

        .mock-menu {
            list-style: none;
            padding: 12px 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mock-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: #d1fae5;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mock-menu-item.active, .mock-menu-item:hover {
            background: rgba(255,255,255,0.14);
            color: #ffffff;
            border-right: 3px solid #34d399;
        }

        .mock-main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            overflow: hidden;
        }

        .mock-topbar {
            background: var(--color-surface);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mock-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* Buttons & Badges */
        .btn-em {
            background-color: var(--color-emerald);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-em:hover {
            background-color: var(--color-dark-emerald);
        }

        .btn-out {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-dark);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .badge-em {
            background: var(--color-soft-mint);
            color: var(--color-dark-emerald);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--color-mint-border);
        }

        /* Responsive Simulated States */
        .window-360 { max-width: 360px !important; }
        .window-390 { max-width: 390px !important; }
        .window-768 { max-width: 768px !important; }
        .window-1024 { max-width: 1024px !important; }
        .window-1440 { max-width: 1440px !important; }

        .drawer-closed .mock-sidebar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Top Preview Controls -->
    <header class="preview-topbar">
        <div class="preview-title">
            <i class="fa-solid fa-crown"></i>
            <span>معاينة الواجهة التفاعلية الشاملة (Phase 5) — شركة الأميرة</span>
        </div>

        <!-- Viewport Switcher -->
        <div class="viewport-controls">
            <button class="vp-btn active" onclick="setViewport(1440, this)">
                <i class="fa-solid fa-desktop"></i> حاسوب (1440px)
            </button>
            <button class="vp-btn" onclick="setViewport(1024, this)">
                <i class="fa-solid fa-laptop"></i> محمول (1024px)
            </button>
            <button class="vp-btn" onclick="setViewport(768, this)">
                <i class="fa-solid fa-tablet-screen-button"></i> تابلت (768px)
            </button>
            <button class="vp-btn" onclick="setViewport(390, this)">
                <i class="fa-solid fa-mobile-screen"></i> هاتف (390px)
            </button>
            <button class="vp-btn" onclick="setViewport(360, this)">
                <i class="fa-solid fa-mobile"></i> هاتف صغير (360px)
            </button>
        </div>

        <div>
            <span class="badge-em"><i class="fa-solid fa-check-circle"></i> تم التحقق 100% بدون أي أخطاء JS</span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="preview-frame-container">
        <div class="preview-window window-1440" id="preview-window">
            
            <!-- Sidebar -->
            <aside class="mock-sidebar" id="mock-sidebar">
                <div class="mock-brand">
                    <i class="fa-solid fa-crown"></i>
                    <div>
                        <h1>شركة الأميرة</h1>
                        <p>للتوريدات العامة والتجارة</p>
                    </div>
                </div>
                <ul class="mock-menu">
                    <li class="mock-menu-item active" onclick="switchMockTab('dashboard', this)">
                        <i class="fa-solid fa-gauge"></i> <span>لوحة التحكم</span>
                    </li>
                    <li class="mock-menu-item" onclick="switchMockTab('inventory', this)">
                        <i class="fa-solid fa-boxes-stacking"></i> <span>الأصناف والمخزون</span>
                    </li>
                    <li class="mock-menu-item" onclick="switchMockTab('invoices', this)">
                        <i class="fa-solid fa-file-invoice-dollar"></i> <span>المبيعات والفواتير</span>
                    </li>
                    <li class="mock-menu-item" onclick="switchMockTab('customers', this)">
                        <i class="fa-solid fa-users"></i> <span>العملاء</span>
                    </li>
                    <li class="mock-menu-item" onclick="switchMockTab('suppliers', this)">
                        <i class="fa-solid fa-truck"></i> <span>الموردون</span>
                    </li>
                    <li class="mock-menu-item" onclick="switchMockTab('reports', this)">
                        <i class="fa-solid fa-chart-bar"></i> <span>التقارير</span>
                    </li>
                    <li class="mock-menu-item" onclick="switchMockTab('settings', this)">
                        <i class="fa-solid fa-gear"></i> <span>الإعدادات والنسخ</span>
                    </li>
                </ul>
            </aside>

            <!-- Main Area -->
            <div class="mock-main-wrapper">
                <div class="mock-topbar">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button class="btn-out" style="padding: 6px 10px;" onclick="toggleMockSidebar()" title="تبديل القائمة الجانبية">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                        <h2 style="font-size: 15px; font-weight: 800;" id="mock-page-title">لوحة التحكم</h2>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span class="badge-em"><i class="fa-solid fa-cloud"></i> متصل بالسحابة (Supabase)</span>
                        <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--color-emerald); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;">
                            م
                        </div>
                    </div>
                </div>

                <!-- Mock Body Content -->
                <div class="mock-content" id="mock-content">
                    <!-- Dynamic Tab Content rendered via JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        function setViewport(width, btn) {
            document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const win = document.getElementById('preview-window');
            win.className = 'preview-window window-' + width;
            if (width <= 768) {
                win.classList.add('drawer-closed');
            } else {
                win.classList.remove('drawer-closed');
            }
        }

        function toggleMockSidebar() {
            document.getElementById('preview-window').classList.toggle('drawer-closed');
        }

        function switchMockTab(tab, el) {
            document.querySelectorAll('.mock-menu-item').forEach(m => m.classList.remove('active'));
            if (el) el.classList.add('active');
            
            const titleEl = document.getElementById('mock-page-title');
            const content = document.getElementById('mock-content');

            if (tab === 'dashboard') {
                titleEl.innerText = 'لوحة التحكم';
                content.innerHTML = `
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px;">
                        <div style="background: #fff; border-right: 4px solid var(--color-emerald); padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
                            <div style="font-size: 12px; color: var(--text-muted);">إجمالي المبيعات</div>
                            <div style="font-size: 22px; font-weight: 800; color: var(--text-dark); margin: 4px 0;">185,420.50 ج.م</div>
                            <div style="font-size: 11px; color: var(--color-emerald);"><i class="fa-solid fa-check"></i> فواتير معتمدة</div>
                        </div>
                        <div style="background: #fff; border-right: 4px solid var(--info); padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
                            <div style="font-size: 12px; color: var(--text-muted);">عدد الفواتير</div>
                            <div style="font-size: 22px; font-weight: 800; color: var(--text-dark); margin: 4px 0;">48 فاتورة</div>
                            <div style="font-size: 11px; color: var(--text-muted);">صادرة ومسجلة</div>
                        </div>
                        <div style="background: #fff; border-right: 4px solid var(--success); padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
                            <div style="font-size: 12px; color: var(--text-muted);">المنتجات النشطة</div>
                            <div style="font-size: 22px; font-weight: 800; color: var(--text-dark); margin: 4px 0;">124 صنف</div>
                            <div style="font-size: 11px; color: var(--success);"><i class="fa-solid fa-box"></i> متوفر بالمخزن</div>
                        </div>
                        <div style="background: #fff; border-right: 4px solid var(--warning); padding: 16px; border-radius: 8px; box-shadow: var(--shadow-sm);">
                            <div style="font-size: 12px; color: var(--text-muted);">تنبيهات النواقص</div>
                            <div style="font-size: 22px; font-weight: 800; color: var(--warning); margin: 4px 0;">3 أصناف</div>
                            <div style="font-size: 11px; color: var(--text-muted);">وصلت لحد الطلب</div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                        <button class="btn-em" onclick="switchMockTab('invoices')"><i class="fa-solid fa-plus"></i> + فاتورة جديدة</button>
                        <button class="btn-out" onclick="switchMockTab('inventory')"><i class="fa-solid fa-box"></i> دليل الأصناف</button>
                        <button class="btn-out" onclick="switchMockTab('reports')"><i class="fa-solid fa-chart-pie"></i> التقارير والتحليلات</button>
                    </div>

                    <div style="background: #fff; border: 1px solid var(--border-light); border-radius: 8px; padding: 16px;">
                        <h4 style="font-size: 14px; font-weight: 800; margin-bottom: 12px;"><i class="fa-solid fa-clock-rotate-left" style="color: var(--color-emerald);"></i> أحدث المعاملات المسجلة اليوم</h4>
                        <table style="width: 100%; border-collapse: collapse; font-size: 12.5px;">
                            <thead style="background: #f1f5f9; text-align: right;">
                                <tr>
                                    <th style="padding: 8px;">رقم المعاملة</th>
                                    <th style="padding: 8px;">النوع</th>
                                    <th style="padding: 8px;">الطرف الثاني</th>
                                    <th style="padding: 8px;">الإجمالي</th>
                                    <th style="padding: 8px;">الحالة</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr style="border-bottom: 1px solid #f1f5f9;">
                                    <td style="padding: 8px; font-weight: 700;">INV-2026-0048</td>
                                    <td style="padding: 8px;">فاتورة مبيعات</td>
                                    <td style="padding: 8px;">شركة الأهرام للتجارة</td>
                                    <td style="padding: 8px; font-weight: 800;">14,250.00 ج.م</td>
                                    <td style="padding: 8px;"><span class="badge-em">معتمدة</span></td>
                                </tr>
                                <tr style="border-bottom: 1px solid #f1f5f9;">
                                    <td style="padding: 8px; font-weight: 700;">REC-2026-0012</td>
                                    <td style="padding: 8px;">إذن توريد مخزن</td>
                                    <td style="padding: 8px;">مؤسسة النور للاستيراد</td>
                                    <td style="padding: 8px; font-weight: 800;">32,000.00 ج.م</td>
                                    <td style="padding: 8px;"><span class="badge-em">معتمدة</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (tab === 'settings') {
                titleEl.innerText = 'الإعدادات والنسخ الاحتياطي';
                content.innerHTML = `
                    <div style="background: #fff; border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden;">
                        <div style="background: #f8fafc; border-bottom: 1px solid var(--border-light); padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto;">
                            <button class="btn-em" style="font-size: 12px; padding: 6px 12px;"><i class="fa-solid fa-building"></i> بيانات وهوية المؤسسة</button>
                            <button class="btn-out" style="font-size: 12px; padding: 6px 12px;"><i class="fa-solid fa-shield-halved"></i> النسخ الاحتياطي</button>
                            <button class="btn-out" style="font-size: 12px; padding: 6px 12px;"><i class="fa-solid fa-cloud"></i> الربط السحابي</button>
                            <button class="btn-out" style="font-size: 12px; padding: 6px 12px;"><i class="fa-solid fa-user-circle"></i> معلومات الحساب</button>
                            <button class="btn-out" style="font-size: 12px; padding: 6px 12px;"><i class="fa-solid fa-circle-info"></i> حالة الترقيات</button>
                        </div>
                        <div style="padding: 20px;">
                            <h3 style="font-size: 15px; font-weight: 800; margin-bottom: 14px; color: var(--color-emerald);">بيانات وهوية شركة الأميرة (الهوية الرسمية للمطبوعات)</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 14px;">
                                <div>
                                    <label style="display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px;">اسم المؤسسة التجاري</label>
                                    <input type="text" value="الأميرة للتوريدات العامة والتجارة" style="width: 100%; padding: 8px 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 13px;">
                                </div>
                                <div>
                                    <label style="display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px;">طبيعة النشاط</label>
                                    <input type="text" value="توريدات عامة وتجارة" style="width: 100%; padding: 8px 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 13px;">
                                </div>
                            </div>
                            <div style="margin-top: 20px; display: flex; gap: 10px;">
                                <button class="btn-em"><i class="fa-solid fa-floppy-disk"></i> حفظ بيانات المؤسسة</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                titleEl.innerText = tab === 'invoices' ? 'المبيعات والفواتير' : (tab === 'inventory' ? 'الأصناف والمخزون' : (tab === 'reports' ? 'التقارير' : (tab === 'customers' ? 'العملاء' : 'الموردون')));
                content.innerHTML = `
                    <div style="background: #fff; border: 1px solid var(--border-light); border-radius: 8px; padding: 30px; text-align: center;">
                        <i class="fa-solid fa-circle-check" style="font-size: 40px; color: var(--color-emerald); margin-bottom: 12px;"></i>
                        <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 8px;">قسم ${titleEl.innerText} مكتمل ونشط في index.html</h3>
                        <p style="font-size: 13px; color: var(--text-muted); max-width: 500px; margin: 0 auto 20px;">
                            تم تدقيق وفحص هذا القسم برمجياً بالكامل مع دعم التجاوب لكافة الشاشات (360px حتى 1440px).
                        </p>
                        <a href="index.html" class="btn-em"><i class="fa-solid fa-arrow-up-right-from-square"></i> فتح التطبيق المباشر (index.html)</a>
                    </div>
                `;
            }
        }

        // Initialize dashboard
        switchMockTab('dashboard', document.querySelector('.mock-menu-item.active'));
    </script>
</body>
</html>
