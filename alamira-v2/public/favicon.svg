<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Brand Dark Navy Rounded Background -->
  <rect width="64" height="64" rx="16" fill="#11243A"/>
  <!-- Elegant Teal Ambient Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#0F766E" stroke-width="2" fill="none"/>
  <!-- Stylized Al-Amira 'a' Character matching official wordmark typography -->
  <g transform="translate(32, 33)">
    <!-- Circular Bowl -->
    <circle cx="-5" cy="0" r="12" stroke="#FFFFFF" stroke-width="5.5" fill="none"/>
    <!-- Vertical Right Stem with Rounded Caps -->
    <line x1="7" y1="-12" x2="7" y2="12" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Subtle Teal Accent Dot representing precision supplies -->
    <circle cx="7" cy="-18" r="2.5" fill="#14B8A6"/>
  </g>
</svg>
