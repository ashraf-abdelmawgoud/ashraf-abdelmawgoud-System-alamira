  </defs>
  <!-- Background with subtle border matching official brand -->
  <rect width="192" height="192" rx="40" fill="#ffffff" />
  <rect x="2" y="2" width="188" height="188" rx="38" fill="none" stroke="#D9E2EC" stroke-width="3" />
